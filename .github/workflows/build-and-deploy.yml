name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ngi-tracker-backend:latest
            ghcr.io/${{ github.repository_owner }}/ngi-tracker-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_APP_NAME=NGI Tracker
          tags: |
            ghcr.io/${{ github.repository_owner }}/ngi-tracker-frontend:latest
            ghcr.io/${{ github.repository_owner }}/ngi-tracker-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Trigger Coolify redeploy via webhook
        run: |
          if [ -n "${{ secrets.COOLIFY_WEBHOOK_URL }}" ]; then
            curl -s -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}" \
              --max-time 30
            echo "Coolify webhook triggered."
          else
            echo "No COOLIFY_WEBHOOK_URL secret — Coolify will poll git and redeploy automatically."
          fi

      - name: Wait and verify site
        run: |
          echo "Waiting 60s for containers to swap..."
          sleep 60
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://itasset.nationalgroupindia.com --max-time 10)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "Site is UP."; exit 0; fi
            sleep 10
          done
          echo "Site check timed out."
          exit 1
