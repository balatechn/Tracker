name: Build & Deploy

on:
  push:
    branches: [main, junobo-hotels]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tags (branch-aware)
        id: tags
        run: |
          if [ "${{ github.ref_name }}" = "junobo-hotels" ]; then
            echo "BACKEND_TAG=jh-tracker-backend" >> $GITHUB_OUTPUT
            echo "FRONTEND_TAG=jh-tracker-frontend" >> $GITHUB_OUTPUT
            echo "APP_NAME=JH Tracker" >> $GITHUB_OUTPUT
          else
            echo "BACKEND_TAG=ngi-tracker-backend" >> $GITHUB_OUTPUT
            echo "FRONTEND_TAG=ngi-tracker-frontend" >> $GITHUB_OUTPUT
            echo "APP_NAME=NGI Tracker" >> $GITHUB_OUTPUT
          fi

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.tags.outputs.BACKEND_TAG }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ steps.tags.outputs.BACKEND_TAG }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.tags.outputs.BACKEND_TAG }}
          cache-to: type=gha,mode=max,scope=${{ steps.tags.outputs.BACKEND_TAG }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_APP_NAME=${{ steps.tags.outputs.APP_NAME }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.tags.outputs.FRONTEND_TAG }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ steps.tags.outputs.FRONTEND_TAG }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.tags.outputs.FRONTEND_TAG }}
          cache-to: type=gha,mode=max,scope=${{ steps.tags.outputs.FRONTEND_TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Trigger Coolify redeploy via webhook
        run: |
          if [ -n "${{ secrets.COOLIFY_WEBHOOK_URL_JH }}" ] && [ "${{ github.ref_name }}" = "junobo-hotels" ]; then
            curl -s -X GET "${{ secrets.COOLIFY_WEBHOOK_URL_JH }}" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_WEBHOOK_TOKEN_JH }}" \
              --max-time 30
            echo "Coolify JH webhook triggered."
          elif [ -n "${{ secrets.COOLIFY_WEBHOOK_URL }}" ]; then
            curl -s -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}" \
              --max-time 30
            echo "Coolify webhook triggered."
          else
            echo "No COOLIFY_WEBHOOK_URL secret — Coolify will poll git and redeploy automatically."
          fi

      - name: Wait and verify site
        run: |
          if [ "${{ github.ref_name }}" = "junobo-hotels" ]; then
            CHECK_URL="http://187.127.134.246:4002/health"
          else
            CHECK_URL="https://itasset.nationalgroupindia.com"
          fi
          echo "Waiting 90s for containers to start..."
          sleep 90
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$CHECK_URL" --max-time 10)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "Site is UP."; exit 0; fi
            sleep 15
          done
          echo "Site check timed out."
          exit 1
