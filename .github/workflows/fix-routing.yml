name: Fix Coolify Routing After Deploy

on:
  push:
    branches: [main]

jobs:
  fix-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Coolify deploy to start and finish
        run: |
          APP_UUID="qys5ng80cub4toeleeywj04r"
          COOLIFY_URL="http://187.127.134.246:8000"
          TOKEN="${{ secrets.COOLIFY_TOKEN }}"

          echo "Waiting 30s for Coolify to pick up the push..."
          sleep 30

          echo "Polling for deploy to complete..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s "$COOLIFY_URL/api/v1/applications/$APP_UUID" \
              -H "Authorization: Bearer $TOKEN" | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "Attempt $i: status=$STATUS"
            if echo "$STATUS" | grep -q "running"; then
              echo "Deploy finished."
              break
            fi
            sleep 10
          done

      - name: Set domain and restart containers
        run: |
          APP_UUID="qys5ng80cub4toeleeywj04r"
          COOLIFY_URL="http://187.127.134.246:8000"
          TOKEN="${{ secrets.COOLIFY_TOKEN }}"

          echo "Setting docker_compose_domains..."
          curl -s -X PATCH "$COOLIFY_URL/api/v1/applications/$APP_UUID" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"docker_compose_domains":[{"name":"frontend","domain":"http://itasset.nationalgroupindia.com"}]}'

          echo "Restarting containers..."
          curl -s -X POST "$COOLIFY_URL/api/v1/applications/$APP_UUID/restart" \
            -H "Authorization: Bearer $TOKEN"

          echo "Waiting 40s for restart to complete..."
          sleep 40

      - name: Verify site is up
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://itasset.nationalgroupindia.com)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Site is UP."
              exit 0
            fi
            sleep 10
          done
          echo "Site did not come up in time."
          exit 1
