name: Fix Coolify Routing After Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Coolify build to finish
        run: |
          APP_UUID="qys5ng80cub4toeleeywj04r"
          COOLIFY_URL="http://187.127.134.246:8000"
          TOKEN="${{ secrets.COOLIFY_TOKEN }}"

          echo "Waiting 5 minutes for Docker build..."
          sleep 300

          echo "Polling until status=running and no deploy in progress..."
          for i in $(seq 1 60); do
            RESP=$(curl -s "$COOLIFY_URL/api/v1/applications/$APP_UUID" -H "Authorization: Bearer $TOKEN")
            STATUS=$(echo "$RESP" | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "Attempt $i: status=$STATUS"
            if echo "$STATUS" | grep -q "running"; then
              echo "App running. Waiting 15s extra to ensure deploy settled..."
              sleep 15
              break
            fi
            sleep 10
          done

      - name: Patch domain and restart (with retry)
        run: |
          APP_UUID="qys5ng80cub4toeleeywj04r"
          COOLIFY_URL="http://187.127.134.246:8000"
          TOKEN="${{ secrets.COOLIFY_TOKEN }}"

          echo "Patching docker_compose_domains..."
          curl -s -X PATCH "$COOLIFY_URL/api/v1/applications/$APP_UUID" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"docker_compose_domains":[{"name":"frontend","domain":"http://itasset.nationalgroupindia.com"}]}'

          echo ""
          echo "Triggering full redeploy (applies updated docker_compose_domains)..."
          for attempt in $(seq 1 5); do
            DEPLOY=$(curl -s -X GET "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUID&force=false" \
              -H "Authorization: Bearer $TOKEN")
            echo "Deploy attempt $attempt: $DEPLOY"
            if echo "$DEPLOY" | grep -q "queued\|uuid\|message"; then
              echo "Deploy accepted."
              break
            fi
            echo "Blocked, waiting 30s..."
            sleep 30
          done

          echo "Waiting 5 minutes for redeploy to complete..."
          sleep 300

      - name: Verify site is up
        run: |
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://itasset.nationalgroupindia.com --max-time 10)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Site is UP."
              exit 0
            fi
            sleep 10
          done
          echo "Site did not come up."
          exit 1
