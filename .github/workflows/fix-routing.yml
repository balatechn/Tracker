name: Verify Site After Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Coolify build
        run: sleep 360

      - name: Verify site is up
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://itasset.nationalgroupindia.com --max-time 10)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Site is UP."
              exit 0
            fi
            sleep 10
          done
          echo "Site did not come up."
          exit 1
