name: Fix Coolify Routing After Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger full Coolify deploy (build + run latest code)
        run: |
          APP_UUID="qys5ng80cub4toeleeywj04r"
          COOLIFY_URL="http://187.127.134.246:8000"
          TOKEN="${{ secrets.COOLIFY_TOKEN }}"

          echo "Triggering full deploy (rebuild from latest git)..."
          DEPLOY=$(curl -s -X POST "$COOLIFY_URL/api/v1/applications/$APP_UUID/deploy?force=true" \
            -H "Authorization: Bearer $TOKEN")
          echo "Deploy response: $DEPLOY"

          echo "Waiting 3 minutes for build + start..."
          sleep 180

      - name: Poll until app is running
        run: |
          APP_UUID="qys5ng80cub4toeleeywj04r"
          COOLIFY_URL="http://187.127.134.246:8000"
          TOKEN="${{ secrets.COOLIFY_TOKEN }}"

          for i in $(seq 1 30); do
            STATUS=$(curl -s "$COOLIFY_URL/api/v1/applications/$APP_UUID" \
              -H "Authorization: Bearer $TOKEN" | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "Attempt $i: status=$STATUS"
            if echo "$STATUS" | grep -qE "running"; then
              echo "App is running."
              break
            fi
            sleep 10
          done

      - name: Patch domain and restart to apply routing
        run: |
          APP_UUID="qys5ng80cub4toeleeywj04r"
          COOLIFY_URL="http://187.127.134.246:8000"
          TOKEN="${{ secrets.COOLIFY_TOKEN }}"

          echo "Patching docker_compose_domains..."
          PATCH=$(curl -s -X PATCH "$COOLIFY_URL/api/v1/applications/$APP_UUID" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"docker_compose_domains":[{"name":"frontend","domain":"http://itasset.nationalgroupindia.com"}]}')
          echo "Patch: $PATCH"

          echo "Restarting to apply domain patch..."
          curl -s -X POST "$COOLIFY_URL/api/v1/applications/$APP_UUID/restart" \
            -H "Authorization: Bearer $TOKEN"

          echo "Waiting 60s..."
          sleep 60

      - name: Verify site is up
        run: |
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://itasset.nationalgroupindia.com --max-time 10)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Site is UP with latest code."
              exit 0
            fi
            sleep 10
          done
          echo "Site did not come up."
          exit 1
