version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trackerdb}
      POSTGRES_USER: ${POSTGRES_USER:-trackeruser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackerpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tracker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trackeruser} -d ${POSTGRES_DB:-trackerdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trackeruser}:${POSTGRES_PASSWORD:-trackerpass}@db:5432/${POSTGRES_DB:-trackerdb}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      PORT: 4000
      NODE_ENV: production
      N8N_WEBHOOK_BASE_URL: http://n8n:5678
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-944d20e2-8841-46b8-9ba6-b0b8d086757b}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-2b20a887-0260-4199-b6b0-ebca15d4475a}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      MAIL_FROM: ${MAIL_FROM:-connect@nationalgroupindia.com}
      APP_BASE_URL: https://itasset.nationalgroupindia.com
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-ngi-n8n-secret-2026}
      CORS_ORIGIN: https://itasset.nationalgroupindia.com,https://ngi-tracker.vercel.app
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tracker-network
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # HTTP
      - "traefik.http.routers.ngi-api-http.rule=Host(`api.itasset.nationalgroupindia.com`)"
      - "traefik.http.routers.ngi-api-http.entrypoints=http"
      - "traefik.http.services.ngi-api.loadbalancer.server.port=4000"
      # HTTPS
      - "traefik.http.routers.ngi-api-https.rule=Host(`api.itasset.nationalgroupindia.com`)"
      - "traefik.http.routers.ngi-api-https.entrypoints=https"
      - "traefik.http.routers.ngi-api-https.tls=true"
      - "traefik.http.routers.ngi-api-https.service=ngi-api"

  # One-shot: writes Traefik file-based config for API subdomain.
  # File-based routers survive Coolify deploys; container labels may reset.
  traefik-config:
    image: alpine:3.20
    restart: "no"
    volumes:
      - /data/coolify/proxy/dynamic:/dynamic
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /dynamic/ngi-tracker.yaml <<'EOF'
        http:
          routers:
            ngi-api-http:
              rule: Host(`api.itasset.nationalgroupindia.com`)
              entryPoints:
                - http
              service: ngi-api
            ngi-api-https:
              rule: Host(`api.itasset.nationalgroupindia.com`)
              entryPoints:
                - https
              tls:
                certResolver: letsencrypt
              service: ngi-api
          services:
            ngi-api:
              loadBalancer:
                servers:
                  - url: "http://187.127.134.246:4000"
        EOF
        echo "Traefik API config written."

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - WEBHOOK_URL=http://n8n.itasset.nationalgroupindia.com
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-n8n-encryption-key-change-me-32ch}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-Admin@123}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-trackerdb}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-trackeruser}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-trackerpass}
      - DB_POSTGRESDB_SCHEMA=n8n
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tracker-network
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ngi-n8n.rule=Host(`n8n.itasset.nationalgroupindia.com`)"
      - "traefik.http.routers.ngi-n8n.entrypoints=http"
      - "traefik.http.services.ngi-n8n.loadbalancer.server.port=5678"
      - "traefik.docker.network=coolify"

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local

networks:
  tracker-network:
    driver: bridge
  coolify:
    external: true
