services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jhdb}
      POSTGRES_USER: ${POSTGRES_USER:-jhuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jhpass2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tracker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jhuser} -d ${POSTGRES_DB:-jhdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jhuser}:${POSTGRES_PASSWORD:-jhpass2026}@db:5432/${POSTGRES_DB:-jhdb}
      JWT_SECRET: ${JWT_SECRET:-jh-tracker-jwt-secret-2026}
      PORT: 4000
      NODE_ENV: production
      MAIL_FROM: ${MAIL_FROM:-connect@junobohotels.com}
      APP_BASE_URL: ${APP_BASE_URL:-https://jh-tracker.vercel.app}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-jh-n8n-secret-2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://jh-tracker.vercel.app}
    ports:
      - "4002:4000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tracker-network
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.jh-api.rule=Host(`jh-api.187.127.134.246.sslip.io`)"
      - "traefik.http.routers.jh-api.entrypoints=http"
      - "traefik.http.services.jh-api.loadbalancer.server.port=4000"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-jh-n8n-encryption-key-2026}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-Admin@123}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-jhdb}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-jhuser}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-jhpass2026}
      - DB_POSTGRESDB_SCHEMA=n8n
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tracker-network
      - coolify

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local

networks:
  tracker-network:
    driver: bridge
  coolify:
    external: true
